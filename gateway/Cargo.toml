[package]
name = "matrix-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to the rev matrix-rust-rtc v0.5.0 builds against, so adding calls later
# does not mean moving to another matrix-sdk. Bump both together.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", features = ["bundled-sqlite", "markdown"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# matrix-rust-sdk carries this in its own [patch] table, which cargo does not
# propagate to a consuming workspace. Copied from matrix-rust-sdk@56bc591. Its
# other patch, async-compat, is not in this crate graph.
[patch.crates-io]
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }
