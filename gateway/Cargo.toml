[package]
name = "matrix-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to the rev matrix-rust-rtc v0.5.0 builds against, so adding calls later
# does not mean moving to another matrix-sdk. Bump both together.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "56bc59112822e7eb25943a95e02502855cdeef2d" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
mime = "0.3"
# Only the extension a MIME type suggests, so a downloaded file is named by what it is.
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# AGPL-3.0 (or Element's commercial licence); pulls a prebuilt libwebrtc at build time.
matrix-rtc-call-sdk = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0", features = ["matrix-sdk"] }
matrix-rtc-call = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0" }
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0" }
matrix-rtc-transport = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0" }
# livekit and reqwest bring rustls with `ring`, matrix-sdk with `aws-lc-rs`; with both, rustls cannot pick a provider
# by itself, so `main` installs this one.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
futures-util = "0.3"
# Pure Rust: the WebRTC VAD crate bundles C that libwebrtc also contains, and the link fails on duplicate symbols.
earshot = "1.2"

# matrix-rust-sdk carries this in its own [patch] table, which cargo does not
# propagate to a consuming workspace. Copied from matrix-rust-sdk@56bc591. Its
# other patch, async-compat, is not in this crate graph.
[patch.crates-io]
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }
